spring.application.name=spring-spock-integration-testing

# Load secrets/settings from a local .env file (git-ignored) in the working directory, if present.
# Real environment variables always win over values in .env.
spring.config.import=optional:file:.env[.properties]

# Which database to use: leave empty for the in-memory H2 database, or set to "postgres".
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# ---------------------------------------------------------------------------
# Default database: H2 in-memory (no install needed).
# Credentials are read from the environment - never hard-code them here.
# For a file-based H2 database set DB_URL=jdbc:h2:file:./data/h2-database
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Schema and seed data come from schema.sql / data.sql (portable across H2 and PostgreSQL)
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.open-in-view=false

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# External ranking service (optional). Without a URL a default "Unranked" rank is returned.
ranking.api.url=${RANKING_API_URL:}
ranking.api.key=${RANKING_API_KEY:}

spring.jpa.show-sql=${SHOW_SQL:false}
