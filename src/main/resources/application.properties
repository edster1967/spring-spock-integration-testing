# Connection settings and credentials come from environment variables (see .env.example).
# Never hard-code passwords or API keys in this file.
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# If you want a file based database, set DB_URL=jdbc:h2:./data/h2-database

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.settings.trace=true

# If you want to see what JPA is generating for tables
# spring.jpa.properties.javax.persistence.schema-generation.create-source=metadata
# spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create
# spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=create.sql

# If you want to change how JPA generates column names in the database
# spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
# spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.show-sql=true

logging.level.org.springframework.jdbc=TRACE
